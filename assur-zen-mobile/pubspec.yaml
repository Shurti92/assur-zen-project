name: assurzen_mobile
description: "AssurZen Mobile — Votre sérénité, notre priorité. Application d’assurance AssurZen Côte d’Ivoire."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Réseau : appels REST vers le backend Java / Spring Boot
  http: ^1.2.2
  # Préférences locales (onboarding, brouillons de devis, réglages)
  shared_preferences: ^2.3.2
  # Stockage chiffré du jeton de session
  flutter_secure_storage: ^9.2.2
  # Appel, WhatsApp, e-mail, ouverture des PDF
  url_launcher: ^6.3.0
  # Photos des pièces justificatives et des sinistres
  image_picker: ^1.1.2
  # Connexion par empreinte digitale
  local_auth: ^2.3.0
  # Hachage du schéma de déverrouillage local
  crypto: ^3.0.6
  # QR code de vérification de l’attestation
  qr_flutter: ^4.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    # Titres et montants.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    # Texte courant, libellés, boutons.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

<section class="ssc-card" aria-label="Récapitulatif de la demande">
  <div class="ssc-top">
    <div>
      <div class="ssc-label">Référence de la demande</div>
      <div class="ssc-reference">{{ suivi().reference }}</div>
    </div>
    <button (click)="copyReference()" [attr.aria-label]="copied() ? 'Référence copiée' : 'Copier la référence'" class="ssc-copy-btn" type="button">
      @if (copied()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
      }
    </button>
  </div>

  <div class="ssc-divider"></div>

  <app-suivi-status-badge [statut]="suivi().statut" [label]="suivi().libelleStatut" />
  <div class="ssc-updated">Dernière mise à jour le {{ formatDate(suivi().dateDerniereMiseAJour) }}</div>
</section>

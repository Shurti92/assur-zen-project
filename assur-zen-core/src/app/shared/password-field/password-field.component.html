<c-input-group>
  <input
    [attr.autoComplete]="autoComplete()"
    cFormControl
    [attr.id]="id()"
    [disabled]="disabled()"
    [type]="visible() ? 'text' : 'password'"
    [value]="value"
    (blur)="onTouched()"
    (input)="onInput($any($event.target).value)"
  />
  <button
    [attr.aria-label]="visible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
    cButton
    color="secondary"
    type="button"
    variant="outline"
    (click)="toggleVisibility()"
  >
    <svg [name]="visible() ? 'cilLowVision' : 'eye'" cIcon></svg>
  </button>
</c-input-group>
